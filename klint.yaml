# yaml-language-server: $schema=https://raw.githubusercontent.com/konvert7/klint/refs/heads/main/klint.schema.json

include: ["src", "scripts", "tests", "emails", "!node_modules/**", "!src/lib/prisma/generated/**"]
plugins: [sonar]
rules:
  no-unguarded-json-parse:
    severity: error
    include: ["src/**", "scripts/**"]
  no-sync-in-async: error
  no-floating-promise: error
  no-misused-promises: error
  no-date-equality: error
  no-optional-chain-on-non-nullable: error
  no-object-in-template: error
  no-nested-template-literals: error
  no-consecutive-array-push: error
  no-string-match: error
  sonar/prefer-string-raw: off

arch:
  layers:
    app-ui:
      - "src/app/**/*.tsx"
      - "src/components/**/*.tsx"
      - "!src/components/ui/**"
    prisma-client:
      - "src/lib/prisma/prisma.ts"
    outside-dao:
      - "src/**"
      - "!src/lib/dao/**"
      - "!src/lib/prisma/**"
      - "!src/auth.ts"
    dao:
      - "src/lib/dao/**"
    request-context:
      - "src/lib/session.ts"
      - "src/auth.ts"
  imports:
    - from: outside-dao
      deny: prisma-client
      type-only: allow
      message: "Prisma belongs in the DAO — add a function under src/lib/dao/ and call that instead. src/auth.ts is the only exception, because Better Auth's prismaAdapter takes the client instance itself."
    - from: dao
      deny: request-context
      type-only: allow
      message: "DAO functions must not read the session — take userId as a parameter instead. Reading request state binds the query to a request, which breaks webhook and cron callers and forces dynamic rendering."
    - from: dao
      deny-packages: ["next/headers", "next/navigation", "next/cache"]
      type-only: allow
      message: "DAO functions must stay request-agnostic — no headers(), cookies(), redirect(), or revalidate. Take userId as a parameter and let the caller handle request state, so webhooks and cron can reuse the same query."
  forbidden:
    - jsx-element: ["button", "input", "label"]
      in: app-ui
      message: "Use the design-system primitives from @/components/ui/* (Button, Input, Label) instead of raw HTML elements."
  maxCommentBlock:
    - limit: 3
      in: ["src/**", "scripts/**", "!src/components/ui/**"]
      message: "Comment block too tall — extract a well-named function instead of stacking explanatory lines. JSDoc blocks are exempt."
