$schema: https://raw.githubusercontent.com/konvert7/klint/refs/tags/v0.33.0/klint.schema.json
include: ["src", "scripts", "tests", "emails", "!node_modules/**", "!src/lib/prisma/generated/**"]
plugins: [sonar]
rules:
  no-unguarded-json-parse:
    severity: error
    include: ["src/**", "scripts/**"]
  no-sync-in-async: error
  no-floating-promise: error
  no-misused-promises: error
  no-date-equality: error
  no-optional-chain-on-non-nullable: error
  no-object-in-template: error
  no-nested-template-literals: error
  no-consecutive-array-push: error
  no-string-match: error
  no-async-predicate: error
  sonar/prefer-string-raw: off

arch:
  layers:
    app-ui:
      - "src/app/**/*.tsx"
      - "src/components/**/*.tsx"
      - "!src/components/ui/**"
    prisma-client:
      - "src/lib/prisma/prisma.ts"
    outside-dao:
      - "src/**"
      - "!src/lib/dao/**"
      - "!src/lib/prisma/**"
      - "!src/auth.ts"
    dao:
      - "src/lib/dao/**"
    ui-primitives:
      - "src/components/ui/**"
    request-context:
      - "src/lib/session.ts"
      - "src/auth.ts"
    feature-storage:
      - "src/lib/storage/**"
      - "src/lib/actions/uploads.ts"
      - "src/app/api/files/**"
    feature-email:
      - "src/lib/aws/**"
      - "emails/**"
    feature-mcp:
      - "src/lib/mcp/**"
      - "src/app/api/mcp/**"
      - "src/lib/dao/mcp.ts"
    feature-stripe:
      - "src/lib/stripe.ts"
      - "src/lib/stripe-public.ts"
      - "src/app/api/stripe/**"
    feature-redis:
      - "src/lib/cache/**"
      - "src/lib/prisma/cache-plugin.ts"
  imports:
    - from: outside-dao
      deny: prisma-client
      type-only: allow
      message: "Prisma belongs in the DAO — add a function under src/lib/dao/ and call that instead. src/auth.ts is the only exception, because Better Auth's prismaAdapter takes the client instance itself."
    - from: ui-primitives
      allow: ["src/components/ui/**", "src/lib/utils.ts", "src/hooks/**"]
      type-only: allow
      message: "shadcn primitives stay app-agnostic — `shadcn add` overwrites these files, taking any app logic with them. Compose app behaviour in src/components instead."
    - from: dao
      deny: request-context
      type-only: allow
      message: "DAO functions must not read the session — take userId as a parameter instead. Reading request state binds the query to a request, which breaks webhook and cron callers and forces dynamic rendering."
    - from: feature-storage
      deny: [feature-email, feature-mcp, feature-stripe, feature-redis]
      type-only: allow
      message: "Removable features must not import each other — configure.ts strips them independently and no remover cascades between peers, so deleting one would leave the other importing files that no longer exist."
    - from: feature-email
      deny: [feature-storage, feature-mcp, feature-stripe, feature-redis]
      type-only: allow
      message: "Removable features must not import each other — configure.ts strips them independently and no remover cascades between peers, so deleting one would leave the other importing files that no longer exist."
    - from: feature-mcp
      deny: [feature-storage, feature-email, feature-stripe, feature-redis]
      type-only: allow
      message: "Removable features must not import each other — configure.ts strips them independently and no remover cascades between peers, so deleting one would leave the other importing files that no longer exist."
    - from: feature-stripe
      deny: [feature-storage, feature-email, feature-mcp, feature-redis]
      type-only: allow
      message: "Removable features must not import each other — configure.ts strips them independently and no remover cascades between peers, so deleting one would leave the other importing files that no longer exist."
    - from: feature-redis
      deny: [feature-storage, feature-email, feature-mcp, feature-stripe]
      type-only: allow
      message: "Removable features must not import each other — configure.ts strips them independently and no remover cascades between peers, so deleting one would leave the other importing files that no longer exist."
    - from: dao
      deny-packages: ["next/headers", "next/navigation", "next/cache"]
      type-only: allow
      message: "DAO functions must stay request-agnostic — no headers(), cookies(), redirect(), or revalidate. Take userId as a parameter and let the caller handle request state, so webhooks and cron can reuse the same query."
  singleton:
    - pattern: "new PrismaClient("
      only: "src/lib/prisma/prisma.ts"
      in: ["src/**", "!src/lib/prisma/generated/**"]
      message: "Instantiate PrismaClient only in src/lib/prisma/prisma.ts — import the default `prisma` singleton everywhere else. A second client opens its own connection pool and silently exhausts Postgres connections."

  forbidden:
    - jsx-element: ["button", "input", "label"]
      in: app-ui
      message: "Use the design-system primitives from @/components/ui/* (Button, Input, Label) instead of raw HTML elements."
    - pattern: "radix-ui"
      in: ["src/**", "!src/components/ui/**"]
      message: "Import the wrapped component from @/components/ui — raw radix-ui primitives belong only in src/components/ui, so the app keeps one UI vocabulary."

  maxLines:
    - limit: 900
      in: ["src/**", "scripts/**"]
      message: "File too long — split it into focused modules."
  maxCommentDensity:
    - limit: 15
      in: ["src/**", "scripts/**", "!src/components/ui/**"]
      ignore: ["@catalyst:"]
      message: "Too much of this file is explanatory prose — encode intent in names and small functions. @catalyst: markers and JSDoc are exempt."
  maxCommentBlock:
    - limit: 3
      in: ["src/**", "scripts/**", "!src/components/ui/**"]
      ignore: ["@catalyst:"]
      message: "Comment block too tall — extract a well-named function instead of stacking explanatory lines. @catalyst: markers and JSDoc are exempt."
